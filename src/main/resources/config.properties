spring.datasource.driverClassName=net.sf.log4jdbc.sql.jdbcapi.DriverSpy
spring.datasource.url=${GATHER_DB_URL}
spring.datasource.username=${GATHER_DB_USERNAME}
spring.datasource.password=${GATHER_DB_PASSWORD}
auth.naver.id=${GATHER_MAIL_USERNAME}
auth.naver.password=${GATHER_MAIL_PASSWORD}
app.base-url=${GATHER_BASE_URL:http://localhost:8080}
app.upload.dir=${GATHER_UPLOAD_DIR:${java.io.tmpdir}/gather-uploads}
app.naver.clientId=${NAVER_CLIENT_ID}
app.naver.clientSecret=${NAVER_CLIENT_SECRET}
app.kakao.clientId=${KAKAO_CLIENT_ID}
app.kakao.clientSecret=${KAKAO_CLIENT_SECRET}
app.kakao.mapAppKey=${KAKAO_MAP_APP_KEY}
app.google.clientId=${GOOGLE_CLIENT_ID}
app.google.clientSecret=${GOOGLE_CLIENT_SECRET}
app.openweather.apiKey=${OPENWEATHER_API_KEY}
